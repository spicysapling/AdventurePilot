name: Sync fork from upstream

# Nightly: fast-forward this fork's mirror branches from AdventurePilotDev/AdventurePilot.
#
# This workflow lives on `fork-ci` (the fork's DEFAULT branch) on purpose: scheduled workflows only
# fire from the default branch, and committing it to `dev` would leave `dev` permanently one commit
# ahead of upstream, so it could never fast-forward again. `fork-ci` holds only this file; `dev`
# stays an exact mirror of upstream.
#
# Fast-forward ONLY. If a mirrored branch has commits upstream lacks, the run fails loudly instead
# of creating a merge commit; keep local work on other branches.
#
# Token: the built-in GITHUB_TOKEN cannot push changes to .github/workflows/ files. When upstream
# touches those, the sync needs the UPSTREAM_SYNC_TOKEN secret: a fine-grained PAT on this repo
# with Contents: read/write and Workflows: read/write. Without the secret it falls back to
# GITHUB_TOKEN, which works on nights upstream did not change a workflow file.

on:
  schedule:
    - cron: '43 10 * * *'   # 10:43 UTC nightly
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: AdventurePilotDev/AdventurePilot
  BRANCHES: dev             # space-separated list of branches to mirror

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward mirror branches
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: |
          rc=0
          up_owner="${UPSTREAM%%/*}"
          me_owner="${GITHUB_REPOSITORY%%/*}"
          for b in $BRANCHES; do
            cmp=$(gh api "repos/$GITHUB_REPOSITORY/compare/$up_owner:$b...$me_owner:$b" \
                    --jq '"\(.ahead_by) \(.behind_by)"') || { echo "::error::$b: compare failed"; rc=1; continue; }
            ahead=${cmp% *}; behind=${cmp#* }
            if [ "$ahead" != "0" ]; then
              echo "::error::$b has $ahead commit(s) upstream lacks; refusing to merge. Move them to another branch or reset $b to upstream."
              rc=1; continue
            fi
            if [ "$behind" = "0" ]; then
              echo "$b: already up to date with $UPSTREAM."
              continue
            fi
            if out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch="$b" 2>&1); then
              echo "$b: fast-forwarded $behind commit(s) from $UPSTREAM."
              echo "- \`$b\`: +$behind commit(s) from $UPSTREAM" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$out"
              if [ "$HAS_PAT" != "true" ]; then
                echo "::error::$b: sync failed using GITHUB_TOKEN. If upstream changed a workflow file, add the UPSTREAM_SYNC_TOKEN secret (see the header of this file)."
              else
                echo "::error::$b: sync failed. Check that UPSTREAM_SYNC_TOKEN has not expired."
              fi
              rc=1
            fi
          done
          exit $rc
